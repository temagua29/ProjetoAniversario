<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil</title>
<link rel="stylesheet" href="perfil.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>

<div id="lb" hidden>
  <button id="lbX" aria-label="Fechar">✕</button>
  <div id="lbBox"></div>
</div>

<body>

<div class="pbar">
  <span>dellenolv</span>
  <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</div>

<div class="phead">
  <div class="pav"><i><img src="imagens/perfil.jpg" alt="Foto de perfil" onerror="this.remove()"></i></div>
  <div class="stats">
    <div><b>3</b><span>publicações</span></div>
    <div><b id="pFol">67 mil</b><span>seguidores</span></div>
    <div><b>340</b><span>seguindo</span></div>
  </div>
</div>

<div class="pbio">
  <b>Deborah Ellen</b><br>
  Gênia da bola.⚽<br>
  A mulher mais linda do Mundo!<br>
  📍 Nova Olinda, CE
</div>

<div class="pbtn">
  <button class="pri" id="pFollow">Seguir</button>
  <button>Mensagem</button>
</div>

<div class="hl">
  <div><i style="background:linear-gradient(135deg,#feda75,#d62976)"></i>Viagens</div>
  <div><i style="background:linear-gradient(135deg,#4f5bd5,#962fbf)"></i>Comida</div>
  <div><i style="background:linear-gradient(135deg,#0ba360,#3cba92)"></i>Pets</div>
  <div><i style="background:linear-gradient(135deg,#fa709a,#fee140)"></i>Arte</div>
  <div><i style="background:linear-gradient(135deg,#30cfd0,#330867)"></i>Música</div>
</div>

<div class="tabs" id="tabs">
  <div class="on" data-t="all"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg></div>
  <div data-t="video"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8 6 4-6 4z"/></svg></div>
</div>

<!-- Apenas 3 espaços de mídia -->
<div class="grid">
  <div class="gi" data-type="foto" style="background:linear-gradient(135deg,#feda75,#d62976)">
    <img src="imagens/1.jpg" alt="" loading="lazy">
  </div>
  <div class="gi" data-type="video" style="background:linear-gradient(135deg,#4f5bd5,#962fbf)">
    <video src="imagens/2.mp4#t=0.1" muted playsinline preload="metadata"></video>
    <svg class="vi" viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg>
  </div>
  <div class="gi" data-type="foto" style="background:linear-gradient(135deg,#0ba360,#3cba92)">
    <img src="imagens/3.jpg" alt="" loading="lazy">
  </div>
</div>

<!-- Barra de navegação: ajuste o href da casa para o nome do seu arquivo do feed -->
<nav>
  <a href="index.html" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg></a>
  <a href="#" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg></a>
  <a href="#" aria-label="Criar"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></a>
  <a href="#" aria-label="Vídeos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8 6 4-6 4z"/></svg></a>
  <a href="perfil.html" aria-label="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></a>
</nav>

<script>
/* Seguir / Seguindo */
var fb = document.getElementById("pFollow"), fol = document.getElementById("pFol");
var seguindo = false;
fb.addEventListener("click", function () {
  seguindo = !seguindo;
  fb.textContent = seguindo ? "Seguindo" : "Seguir";
  fb.className = seguindo ? "" : "pri";
  fol.textContent = seguindo ? "12,8 mil" : "12,8 mil"; /* troque pelos seus números se quiser */
});

/* Abas: todas / só vídeos */
document.getElementById("tabs").addEventListener("click", function (e) {
  var t = e.target.closest("[data-t]"); if (!t) return;
  Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("on", c === t); });
  document.querySelectorAll(".gi").forEach(function (g) {
    g.hidden = t.dataset.t === "video" && g.dataset.type !== "video";
  });
});
var lb = document.getElementById("lb"), box = document.getElementById("lbBox");

function abrir(el) {
  var c = el.cloneNode(true);
  if (c.tagName === "VIDEO") {
    c.removeAttribute("muted");
    c.muted = false;
    c.controls = true;
    c.autoplay = true;
    c.src = c.src.split("#")[0];
  }
  box.innerHTML = "";
  box.appendChild(c);
  lb.hidden = false;
}
function fechar() { box.innerHTML = ""; lb.hidden = true; }

document.getElementById("lbX").addEventListener("click", fechar);
lb.addEventListener("click", function (e) { if (e.target === lb) fechar(); });
document.querySelector(".grid").addEventListener("click", function (e) {
  var g = e.target.closest(".gi"); if (!g) return;
  abrir(g.querySelector("img, video"));
});
</script>
</body>
</html>
